
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Nota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Verificador de Nota</h1>
        <p class="subtitle">Digite sua nota (0 a 100) para ver o resultado</p>

        <div class="input-group">
            <label for="nota">Nota:</label>
            <input type="number" id="nota" placeholder="Ex: 75.5" step="0.1" min="0" max="100">
        </div>

        <button onclick="verificarNota()">Verificar Resultado</button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
